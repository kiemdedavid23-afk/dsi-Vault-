# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true

# Use this property to specify which architecture you want to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Nouvelle Architecture (Fabric/TurboModules) : DÉSACTIVÉE pour DSI Vault.
# Voir justification dans android/build.gradle. À revalider après vérification
# de la compatibilité réelle des modules natifs utilisés (track-player, video, pdf,
# sqlite-storage, ml-kit text-recognition).
newArchEnabled=false

# Moteur JS : Hermes (recommandé, hors ligne, pas de dépendance réseau à l'exécution).
hermesEnabled=true
